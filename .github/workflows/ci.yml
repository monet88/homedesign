name: CI

on:
  push:
    branches: [main, master, implement/**, impl/**]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret regression gate
        run: bash scripts/secret-gate.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Workers-runtime integration suite
        run: npm run wrangler:test

      - name: Smoke suite (migrations → seed → tests)
        run: SMOKE_SKIP_WRANGLER_TEST=1 bash scripts/smoke.sh

      - name: Free-first gate (bundle ≤3MB)
        run: bash scripts/free-first-gate.sh

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: End-to-end deterministic test suite
        run: npm run test:e2e
